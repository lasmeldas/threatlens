name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-sqlite:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -r requirements.txt
      - run: python manage.py makemigrations --check --dry-run
        env:
          DJANGO_DEBUG: "1"
      - run: python manage.py test
        env:
          DJANGO_DEBUG: "1"

  test-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 3s --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements.txt
      - run: python manage.py test
        env:
          DJANGO_DEBUG: "1"
          DB_HOST: localhost
          DB_NAME: postgres
          DB_USER: postgres
          DB_PASSWORD: postgres

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  ml:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ml
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: ml/requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m pytest -q tests
        env:
          NSLKDD_DOWNLOAD: "1"

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the single-service image
        run: docker build -t threatlens .
      - name: Start it and check the health endpoint, the dashboard and the API
        run: |
          docker run -d --name tl -p 10000:10000 \
            -e DJANGO_SECRET_KEY=ci-only-secret-key-for-smoke-test-0123456789 \
            -e DJANGO_SECURE_COOKIES=false \
            -e THREATLENS_ADMIN_USER=analyst -e THREATLENS_ADMIN_PASSWORD=ci-smoke-test-passphrase-1 \
            -e THREATLENS_SEED_DEMO=true threatlens
          for i in $(seq 1 30); do curl -sf localhost:10000/healthz && break; sleep 2; done
          curl -sf localhost:10000/healthz
          curl -sf localhost:10000/alerts/1 | grep -q "<title>ThreatLens</title>"
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:10000/api/alerts/)" = 401
          TOKEN=$(curl -sf -H 'Content-Type: application/json' -d '{"username":"analyst","password":"ci-smoke-test-passphrase-1"}' localhost:10000/api/auth/token/ | python3 -c 'import sys,json;print(json.load(sys.stdin)["token"])')
          curl -sf -H "Authorization: Token $TOKEN" localhost:10000/api/alerts/ | python3 -c 'import sys,json;d=json.load(sys.stdin);assert d["count"]>0,d'
      - if: failure()
        run: docker logs tl
