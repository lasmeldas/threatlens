# One command to run the dashboard, the API and PostgreSQL (open http://localhost:8080):   cp .env.example .env   (edit it)   then   docker compose up --build
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: threatlens
      POSTGRES_USER: threatlens
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U threatlens"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Set DJANGO_SECRET_KEY in .env}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1}
      # Plain HTTP on localhost needs this off. Leave it on (the default) behind HTTPS.
      DJANGO_SECURE_COOKIES: ${DJANGO_SECURE_COOKIES:-false}
      DB_HOST: db
      DB_NAME: threatlens
      DB_USER: threatlens
      DB_PASSWORD: ${DB_PASSWORD}
    expose:
      - "8000"

  web:
    build: ./frontend
    depends_on:
      - api
    ports:
      - "127.0.0.1:8080:80"

volumes:
  dbdata:
